# LiteLLM acts only as MCP Gateway here: no model routes, MCP traffic only.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Caddy terminates TLS in the same compose network; trust its X-Forwarded-For.
  use_x_forwarded_for: true
  mcp_trusted_proxy_ranges: ["172.16.0.0/12"]

mcp_servers:
  sandbox_mcp:
    url: "http://sandbox-mcp:8080/mcp"
    transport: "http"
    description: "BI Sandbox: assess_application, validate_and_deploy, status"
    auth_type: "bearer_token"
    auth_value: os.environ/SANDBOX_GATEWAY_TOKEN
