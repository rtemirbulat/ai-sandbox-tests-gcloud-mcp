# LiteLLM acts only as MCP Gateway here: no model routes, MCP traffic only.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Caddy terminates TLS in the same compose network; trust its X-Forwarded-For.
  use_x_forwarded_for: true
  mcp_trusted_proxy_ranges: ["172.16.0.0/12"]

mcp_servers:
  sandbox_mcp:
    url: "http://sandbox-mcp:8080/mcp"
    transport: "http"
    description: "BI Sandbox: assess_application, validate_and_deploy, status"
    auth_type: "none"
    # Service-to-service secret for sandbox-mcp (checked by its middleware).
    static_headers:
      X-Gateway-Token: os.environ/SANDBOX_GATEWAY_TOKEN
    # Forward the caller's sandbox user token (issued by `sandbox-mcp token <user>`).
    # LiteLLM scrubs its own virtual key from forwarded headers, so identity needs this token.
    extra_headers: ["x-sandbox-token"]
